<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>Fullmakt – föreningsstämma</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      @page { margin: 20mm; }
      body { font-family: -apple-system, Inter, Arial, sans-serif; color: #111; }
      h1 { font-size: 16pt; margin: 0 0 6mm; color: #3F4733; }
      p, li, label { font-size: 11pt; line-height: 1.5; }
      .row { display: flex; gap: 6mm; }
      .col { flex: 1; }
      input { width: 100%; border: 1px solid #ddd; padding: 3mm; font-size: 11pt; }
      .muted { color: #444; font-size: 9.5pt; margin-top: 8mm; }
    </style>
  </head>
  <body>
    <h1>Fullmakt till föreningsstämma</h1>
    <p>Jag/Vi, medlem i <strong>BRF ____________________</strong>, ger härmed fullmakt till:</p>
    <div class="row">
      <div class="col">
        <label>Ombudets namn</label>
        <input />
      </div>
      <div class="col">
        <label>Personnummer</label>
        <input />
      </div>
    </div>

    <p>att företräda mig/oss vid föreningens stämma den _____________.</p>

    <p>Fullmakten gäller även vid eventuell fortsatt stämma.</p>

    <div class="row" style="margin-top: 10mm;">
      <div class="col">
        <label>Medlems namn</label>
        <input />
      </div>
      <div class="col">
        <label>Adress/lgh‑nr</label>
        <input />
      </div>
    </div>

    <div class="row" style="margin-top: 6mm;">
      <div class="col">
        <label>Ort och datum</label>
        <input />
      </div>
      <div class="col">
        <label>Underskrift</label>
        <input />
      </div>
    </div>

    <p class="muted">Ansvarsfriskrivning: Kontrollera alltid föreningens stadgar. Version 1.0</p>
  </body>
  </html>
